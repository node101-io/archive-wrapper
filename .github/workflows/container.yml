name: Container

on:
  pull_request:
  push:
    branches:
      - development

permissions:
  contents: read

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go validation
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        env:
          GOCACHE: /tmp/go-build-cache
        run: go test -tags=purego ./... -count=1

      - name: Run focused race tests
        env:
          GOCACHE: /tmp/go-build-cache
        run: go test -race -tags=purego ./config ./cmd/archive-wrapper -count=1

      - name: Run vet
        env:
          GOCACHE: /tmp/go-build-cache
        run: go vet -tags=purego ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          args: --build-tags=purego ./...

      - name: Verify module files
        run: go mod tidy -diff

  container:
    name: Container validation
    needs: go
    runs-on: ubuntu-24.04
    env:
      IMAGE: archive-wrapper:${{ github.sha }}
      GOCACHE: /tmp/go-build-cache
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Build multi-platform OCI image
        run: |
          make docker-build-multiarch \
            DOCKER_BUILDER="${{ steps.buildx.outputs.name }}" \
            IMAGE="$IMAGE" \
            OCI_OUTPUT="$RUNNER_TEMP/archive-wrapper.oci.tar"
          sha256sum "$RUNNER_TEMP/archive-wrapper.oci.tar"

      - name: Verify reproducible artifacts
        run: |
          make reproducible-build
          make reproducible-image DOCKER_BUILDER="${{ steps.buildx.outputs.name }}"

      - name: Build native test image
        run: make docker-build IMAGE="$IMAGE"

      - name: Run container smoke tests
        env:
          ARCHIVE_WRAPPER_SKIP_BUILD: "1"
          ARCHIVE_WRAPPER_ARTIFACT_DIR: .cache/container-artifacts
        run: make docker-test IMAGE="$IMAGE"

      - name: Upload OCI artifact
        uses: actions/upload-artifact@v4
        with:
          name: archive-wrapper-oci-${{ github.sha }}
          path: ${{ runner.temp }}/archive-wrapper.oci.tar
          if-no-files-found: error
          retention-days: 7

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: container-failure-${{ github.sha }}
          path: .cache/container-artifacts
          if-no-files-found: ignore
          retention-days: 7
