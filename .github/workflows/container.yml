name: Container

on:
  pull_request:
  push:
    branches:
      - development

permissions:
  contents: read

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go validation
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        env:
          GOCACHE: /tmp/go-build-cache
        run: go test -tags=purego ./... -count=1

      - name: Run focused race tests
        env:
          GOCACHE: /tmp/go-build-cache
        run: go test -race -tags=purego ./config ./cmd/archive-wrapper -count=1

      - name: Run vet
        env:
          GOCACHE: /tmp/go-build-cache
        run: go vet -tags=purego ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          args: --build-tags=purego ./...

      - name: Verify module files
        run: go mod tidy -diff

  container:
    name: Container validation
    needs: go
    runs-on: ubuntu-24.04
    env:
      IMAGE: archive-wrapper:${{ github.sha }}
      BUILDER_IMAGE: archive-wrapper-builder:${{ github.sha }}
      GOCACHE: /tmp/go-build-cache
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Build multi-platform OCI image
        run: |
          make docker-build-multiarch \
            DOCKER_BUILDER="${{ steps.buildx.outputs.name }}" \
            IMAGE="$IMAGE" \
            OCI_OUTPUT="$RUNNER_TEMP/archive-wrapper.oci.tar"
          sha256sum "$RUNNER_TEMP/archive-wrapper.oci.tar"

      - name: Verify reproducible artifacts
        run: |
          make reproducible-build
          make reproducible-image DOCKER_BUILDER="${{ steps.buildx.outputs.name }}"

      - name: Build native test image
        run: make docker-build IMAGE="$IMAGE"

      - name: Build builder stage for security scanning
        run: |
          docker buildx build --load --target builder --platform=linux/amd64 \
            -t "$BUILDER_IMAGE" .

      - name: Prepare security report directory
        run: mkdir -p .cache/container-artifacts

      - name: Install govulncheck
        env:
          CGO_ENABLED: "0"
          GOBIN: ${{ runner.temp }}/govulncheck-bin
        run: |
          mkdir -p "$GOBIN"
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Report reachable Go vulnerabilities
        run: |
          raw_report="$RUNNER_TEMP/govulncheck.sarif"
          docker run --rm \
            --env GOTELEMETRY=off \
            --entrypoint /tools/govulncheck \
            --volume "$RUNNER_TEMP/govulncheck-bin:/tools:ro" \
            "$BUILDER_IMAGE" \
            -tags=purego -format sarif ./cmd/archive-wrapper \
            > "$raw_report"
          jq -e '
            .runs |= map(
              (.results // []) |= map(select(.level == "error"))
              | . as $run
              | .tool.driver.rules = [
                  (.tool.driver.rules // [])[]
                  | select(.id as $id | any($run.results[]; .ruleId == $id))
                ]
            )
          ' "$raw_report" > .cache/container-artifacts/govulncheck.sarif

      - name: Enforce builder OS vulnerability policy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.BUILDER_IMAGE }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os
          severity: CRITICAL,HIGH
          scanners: vuln
          version: v0.73.0

      - name: Enforce runtime OS vulnerability policy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os
          severity: CRITICAL,HIGH
          scanners: vuln
          skip-setup-trivy: true

      - name: Run container smoke tests
        env:
          ARCHIVE_WRAPPER_SKIP_BUILD: "1"
          ARCHIVE_WRAPPER_ARTIFACT_DIR: .cache/container-artifacts
        run: make docker-test IMAGE="$IMAGE"

      - name: Upload OCI artifact
        uses: actions/upload-artifact@v4
        with:
          name: archive-wrapper-oci-${{ github.sha }}
          path: ${{ runner.temp }}/archive-wrapper.oci.tar
          if-no-files-found: error
          retention-days: 7

      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-vulnerabilities-${{ github.sha }}
          path: .cache/container-artifacts/govulncheck.sarif
          if-no-files-found: warn
          retention-days: 7

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: container-failure-${{ github.sha }}
          path: .cache/container-artifacts
          if-no-files-found: ignore
          retention-days: 7
