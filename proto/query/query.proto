syntax = "proto3";

package query;

import "actions/action.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/node101-io/archive-wrapper/query;query";

service Query {
  rpc GetActionsInRange(QueryGetActionsInRangeRequest) returns (QueryGetActionsInRangeResponse);
  rpc GetMinaBlockHeight(QueryGetMinaBlockHeightRequest) returns (QueryGetMinaBlockHeightResponse);
}

message QueryGetActionsInRangeRequest {
  option (gogoproto.goproto_getters) = false;

  int64 start_block_height = 1;
  int64 end_block_height = 2;
}

message QueryGetActionsInRangeResponse {
  option (gogoproto.goproto_getters) = false;

  repeated actions.Action actions = 1;
}

message QueryGetMinaBlockHeightRequest {
  option (gogoproto.goproto_getters) = false;
}

message QueryGetMinaBlockHeightResponse {
  option (gogoproto.goproto_getters) = false;

  int64 block_height = 1;
}